<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTopup - Tempat Top Up Game Termurah & Instan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding: 15px 0 40px 0; }
        
        .main-wrapper { max-width: 600px; margin: 0 auto; width: 92%; }
        
        h1 { text-align: center; color: #4ade80; font-size: 28px; letter-spacing: 1.5px; font-weight: 800; margin-top: 10px; }
        .subtitle { text-align: center; color: #ef4444; margin-bottom: 25px; font-size: 11px; font-weight: bold; letter-spacing: 1px; }

        .container { background: #141822; padding: 16px; border-radius: 16px; border: 1px solid #1f2635; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .section-title { font-size: 13px; font-weight: 700; margin-bottom: 15px; color: #4ade80; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* LOBI ALL GAME (MENGGUNAKAN GAMBAR ASLI) */
        .grid-games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .game-card { background: #1a202c; border: 1px solid #2d364d; border-radius: 12px; padding: 10px 6px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
        .game-card.active { border-color: #4ade80; background: #1e293b; box-shadow: 0 0 10px rgba(74,222,128,0.3); }
        .game-card img { width: 100%; height: 55px; object-fit: cover; border-radius: 8px; margin-bottom: 6px; display: block; }
        .game-card span { font-size: 11px; font-weight: bold; color: #f3f4f6; display: block; }
        .game-card .badge-discount { position: absolute; top: 0; right: 0; background: #ef4444; color: white; font-size: 8px; padding: 1px 4px; border-bottom-left-radius: 6px; font-weight: bold; z-index: 5; }

        /* Form Input */
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 14px; background: #1f2635; border: 1px solid #2d364d; border-radius: 10px; font-size: 14px; color: white; outline: none; }
        input:focus { border-color: #4ade80; }
        
        /* GRID DAFTAR HARGA PAKET (MENGGUNAKAN GAMBAR ASLI) */
        .grid-paket { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; min-height: 100px; }
        .card-paket { border: 1px solid #2d364d; border-radius: 12px; padding: 14px; text-align: center; cursor: pointer; transition: all 0.2s; background: #1a202c; position: relative; display: flex; flex-direction: column; align-items: center; }
        .card-paket:hover { border-color: #4ade80; background: #1f2736; }
        .card-paket.selected { border-color: #4ade80; background: #1e293b; box-shadow: 0 0 14px rgba(74,222,128,0.3); }
        
        .card-paket img { width: 50px; height: 45px; object-fit: contain; margin-bottom: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .card-paket .dm { font-size: 13px; color: #f3f4f6; display: block; margin-bottom: 4px; font-weight: 600; }
        .card-paket .harga { font-size: 14px; color: #4ade80; display: block; font-weight: 800; }
        .card-paket .coret { font-size: 11px; color: #ef4444; text-decoration: line-through; display: block; margin-bottom: 2px; }
        .badge-promo { position: absolute; top: 0; right: 0; background: #ef4444; color: white; font-size: 8px; padding: 2px 6px; border-bottom-left-radius: 8px; font-weight: bold; }
        
        /* Tombol Transaksi */
        .btn-order { width: 100%; background: #25d366; color: white; border: none; padding: 15px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(37,211,102,0.4); margin-bottom: 12px; }
        .btn-order:hover { background: #20ba5a; }
        .btn-wa-manual { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; font-size: 13px; font-weight: bold; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 12px rgba(2,132,199,0.3); }

        /* ALL PAYMENT AREA */
        .payment-section { text-align: center; padding-top: 10px; }
        .payment-title { font-size: 14px; font-weight: 800; color: #4ade80; margin-bottom: 15px; letter-spacing: 2px; text-transform: uppercase; }
        .grid-pay { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
        .pay-badge { background: #ffffff; padding: 8px 4px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 11px; color: #111827; height: 36px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); width: 100%; text-transform: uppercase; }
        .pay-badge.qris { background: #a855f7; color: white; }
        .pay-badge.bca { color: #003399; font-style: italic; font-size: 13px; font-weight: bold; }
        .pay-badge.dana { background: #0086ff; color: white; font-size: 12px; }
        .pay-badge.spay { background: #ff5722; color: white; font-size: 9px; }
        .pay-badge.ovo { background: #4c2a86; color: white; }
        .pay-badge.gopay { background: #00aed6; color: white; }
        .pay-badge.bri { color: #00569b; font-size: 13px; }
        .pay-badge.mandiri { color: #1c3f60; font-size: 10px; }
    </style>
</head>
