<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTopup | Premium & Instant Game Refill</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://jsdelivr.net"></script>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

    <!-- Header Navbar -->
    <nav class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-amber-500 tracking-wider flex items-center">
                <i class="fa-solid fa-bolt-lightning mr-2 animate-bounce"></i>NovaTopup
            </h1>
            <div class="flex items-center space-x-2">
                <span class="text-[10px] bg-amber-500 text-gray-900 font-bold px-2 py-1 rounded-md">
                    HARGA RESELLER UNIPIN
                </span>
                <span class="text-[10px] bg-green-500 text-gray-900 font-bold px-2 py-1 rounded-md animate-pulse">
                    OTOMATIS 1 DETIK
                </span>
            </div>
        </div>
    </nav>

    <!-- Banner & Komponen Gambar Game Utama -->
    <div class="relative h-56 md:h-72 w-full overflow-hidden">
        <!-- Gambar Background Banner Game -->
        <img src="https://unsplash.com" alt="Gaming Banner" class="w-full h-full object-cover opacity-30">
        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-transparent to-transparent"></div>
        
        <div class="absolute bottom-4 left-4 right-4 flex items-center space-x-4">
            <!-- Gambar Ikon Game MLBB Bulat ala Store Besar -->
            <img src="https://unsplash.com" alt="Mobile Legends Icon" class="w-20 h-20 md:w-24 md:h-24 rounded-2xl border-2 border-amber-500 object-cover shadow-2xl">
            <div>
                <h2 class="text-xl md:text-2xl font-bold text-white tracking-wide">Mobile Legends: Bang Bang</h2>
                <p class="text-xs text-amber-400 font-medium mt-0.5"><i class="fa-solid fa-shield-halved mr-1"></i> Jalur Kilat API & Legal 100%</p>
                <p class="text-[11px] text-gray-400 mt-1">Proses instan masuk ke akun tanpa penundaan menit.</p>
            </div>
        </div>
    </div>

    <!-- Layout Grid Utama -->
    <main class="container mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Sisi Kiri: Form Data Akun & Pilihan Produk Murah -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Langkah 1: Pengisian ID Game -->
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-xl">
                <div class="flex items-center space-x-3 mb-4">
                    <span class="bg-amber-500 text-gray-950 font-bold w-6 h-6 flex items-center justify-center rounded-full text-sm">1</span>
                    <h3 class="text-base font-semibold text-white">Masukkan Data Akun MLBB</h3>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">User ID</label>
                        <input type="number" id="userId" placeholder="Contoh: 12345678" class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 focus:outline-none focus:border-amber-500 text-sm text-white transition-colors">
                    </div>
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">Zone ID</label>
                        <input type="number" id="zoneId" placeholder="Contoh: 1234" class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 focus:outline-none focus:border-amber-500 text-sm text-white transition-colors">
                    </div>
                </div>
            </div>

            <!-- Langkah 2: Pilihan Diamond Dibandrol Harga Murah -->
            <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-xl">
                <div class="flex items-center space-x-3 mb-4">
                    <span class="bg-amber-500 text-gray-955 font-bold w-6 h-6 flex items-center justify-center rounded-full text-sm">2</span>
                    <h3 class="text-base font-semibold text-white">Pilih Nominal Diamond (Harga Murah)</h3>
                </div>
                
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    <!-- Item List Murah -->
                    <button onclick="selectProduct('3 Diamonds', 1000)" class="product-card bg-gray-950 border border-gray-800 p-3 rounded-xl text-left transition-all hover:border-amber-500 group relative overflow-hidden">
                        <div class="flex justify-between items-start">
                            <span class="text-amber-500 font-bold text-sm tracking-wide"><i class="fa-solid fa-gem text-xs mr-1"></i>3 Dms</span>
                            <span class="text-[9px] bg-red-950 text-red-400 px-1.5 py-0.5 rounded font-bold">Promo</span>
                        </div>
                        <div class="text-xs font-semibold text-gray-300 mt-2">Rp 1.000</div>
                        <div class="text-[9px] text-gray-500 line-through">Rp 1.500</div>
                    </button>

                    <button onclick="selectProduct('5 Diamonds', 1350)" class="product-card bg-gray-950 border border-gray-800 p-3 rounded-xl text-left transition-all hover:border-amber-500 group relative overflow-hidden">
                        <div class="text-amber-500 font-bold text-sm tracking-wide"><i class="fa-solid fa-gem text-xs mr-1"></i>5 Dms</div>
                        <div class="text-xs font-semibold text-gray-300 mt-2">Rp 1.350</div>
                        <div class="text-[9px] text-gray-500 line-through">Rp 2.000</div>
                    </button>

                    <button onclick="selectProduct('12 Diamonds', 3200)" class="product-card bg-gray-950 border border-gray-800 p-3 rounded-xl text-left transition-all hover:border-amber-500 group relative overflow-hidden">
                        <div class="text-amber-500 font-bold text-sm tracking-wide"><i class="fa-solid fa-gem text-xs mr-1"></i>12 Dms</div>
                        <div class="text-xs font-semibold text-gray-300 mt-2">Rp 3.200</div>
                        <div class="text-[9px] text-gray-500 line-through">Rp 4.500</div>
                    </button>

                    <button onclick="selectProduct('28 Diamonds', 7300)" class="product-card bg-gray-950 border border-gray-800 p-3 rounded-xl text-left transition-all hover:border-amber-500 group relative overflow-hidden">
                        <div class="text-amber-500 font-bold text-sm tracking-wide"><i class="fa-solid fa-gem text-xs mr-1"></i>28 Dms</div>
                        <div class="text-xs font-semibold text-gray-300 mt-2">Rp 7.300</div>
                        <div class="text-[9px] text-gray-500 line-through">Rp 10.000</div>
                    </button>

                    <button onclick="selectProduct('59 Diamonds', 15200)" class="product-card bg-gray-950 border border-gray-800 p-3 rounded-xl text-left transition-all hover:border-amber-500 group relative overflow-hidden">
                        <div class="text-amber-500 font-bold text-sm tracking-wide"><i class="fa-solid fa-gem text-xs mr-1"></i>59 Dms</div>
                        <div class="text-xs font-semibold text-gray-300 mt-2">Rp 15.200</div>
                        <div class="text-[9px] text-gray-500 line-through">Rp 19.500</div>
                    </button>

                    <button onclick="selectProduct('85 Diamonds', 21800)" class="product-card bg-gray-950 border border-gray-800 p-3 rounded-xl text-left transition-all hover:border-amber-500 group relative overflow-hidden">
                        <div class="text-amber-500 font-bold text-sm tracking-wide"><i class="fa-solid fa-gem text-xs mr-1"></i>85 Dms</div>

                        <div class="text-[9px] text-gray-500 line-through">Rp 28.000</div>
                    </button>

                    <button onclick="selectProduct('170 Diamonds', 43500)" class="product-card bg-gray-950 border border-gray-800 p-3 rounded-xl text-left transition-all hover:border-amber-500 group relative overflow-hidden">
                        <div class="text-amber-500 font-bold text-sm tracking-wide"><i class="fa-solid fa-gem text-xs mr-1"></i>170 Dms</div>
                        <div class="text-xs font-semibold text-gray-300 mt-2">Rp 43.500</div>
                        <div class="text-[9px] text-gray-500 line-through">Rp 55.000</div>
                    </button>

                    <button onclick="selectProduct('296 Diamonds', 75000)" class="product-card bg-gray-950 border border-gray-800 p-3 rounded-xl text-left transition-all hover:border-amber-500 group relative overflow-hidden">
                        <div class="text-amber-500 font-bold text-sm tracking-wide"><i class="fa-solid fa-gem text-xs mr-1"></i>296 Dms</div>
                        <div class="text-xs font-semibold text-gray-300 mt-2">Rp 75.000</div>
                        <div class="text-[9px] text-gray-500 line-through">Rp 92.000</div>
                    </button>
